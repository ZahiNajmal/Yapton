[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yapton"
version = "0.1.1"
description = "Yapton is an transpiler that converts Yapton code into Python code."
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
yap = "yapton.cli:main"
